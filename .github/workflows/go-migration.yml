name: Native Go migration gate

on:
  push:
    branches: [go-gio-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Go tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Install native Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev xvfb
      - name: Go preparation and delivery tool tests
        run: go -C tools test -mod=readonly -count=1 ./...
      - name: Prepare pinned sources and require native engine policy gates
        run: go -C tools run -mod=readonly ./cmd/prepare
      - name: Native Go application tests
        run: go test -mod=readonly -count=1 ./cmd/... ./internal/...
      - name: Go vet
        run: go vet -mod=readonly ./cmd/... ./internal/...
      - name: Linux race tests
        if: runner.os == 'Linux'
        run: |
          go test -mod=readonly -race ./cmd/... ./internal/...
          go -C tools test -mod=readonly -race ./...
      - name: Native Crayon rendering at 100 / 125 / 150 percent
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WARPPOCKET_SCREENSHOTS: ${{ github.workspace }}/build/ui-screenshots
        run: xvfb-run -a go test -mod=readonly -tags guirender ./internal/ui -run TestRenderedCrayonStatesAndDPI -count=1
      - name: Linux same-EXE engine and actual Gio window smoke
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          go build -mod=readonly -trimpath -ldflags='-s -w' -o build/warppocket-go ./cmd/warppocket
          xvfb-run -a build/warppocket-go --smoke build/go-smoke-linux/graceful.json

  package:
    name: Native Go Windows package
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Prepare pinned engine sources and native policy tests
        run: go -C tools run -mod=readonly ./cmd/prepare
      - name: Build the only shipped executable
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -trimpath -ldflags="-s -w -H windowsgui" -o dist/WarpPocket.exe ./cmd/warppocket
      - name: Real Gio, native clipboard/picker, same-EXE ownership and crash proof
        run: go -C tools run -mod=readonly ./cmd/smoke --exe ../dist/WarpPocket.exe --out ../build/go-smoke --source-root ..
      - name: Measure against the pinned pre-migration executable
        if: github.ref == 'refs/heads/go-gio-migration'
        run: go -C tools run -mod=readonly ./cmd/footprint --current-report ../build/go-smoke/summary.json --out ../build/go-smoke/footprint-comparison.json
      - name: Upload the tested executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WarpPocket-windows-x64
          path: dist/WarpPocket.exe
          if-no-files-found: error
      - name: Upload safe native evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WarpPocket-go-smoke
          path: build/go-smoke/*.json
          if-no-files-found: warn
