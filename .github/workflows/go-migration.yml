name: Native Go migration gate

on:
  push:
    branches: [go-gio-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gio-windows:
    name: Native Windows Gio frame
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Build native GUI executable without cgo
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o build/WarpPocket-gio-frame.exe ./cmd/warppocket
      - name: Require real Gio frames and clean window close
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\build\WarpPocket-gio-frame.exe -ArgumentList '--ui-smoke', 'build/gio-native-windows.json' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Gio frame gate timed out' }
          if ($process.ExitCode -ne 0) { throw 'Gio frame gate failed' }
          $report = Get-Content build/gio-native-windows.json -Raw | ConvertFrom-Json
          if (-not $report.gio_frame -or $report.frames -lt 3) { throw 'No actual Gio frames' }
          Get-Content build/gio-native-windows.json
      - name: Upload native frame evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gio-native-windows-frame
          path: build/gio-native-windows.json
          if-no-files-found: warn
