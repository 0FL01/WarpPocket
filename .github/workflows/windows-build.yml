name: Headless verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.15'
            platform: linux-amd64
          - os: ubuntu-24.04
            python: '3.13.16'
            platform: linux-amd64
          - os: windows-2022
            python: '3.13.16'
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Fetch and verify real helpers
        run: python scripts/fetch_vendor.py --platform ${{ matrix.platform }}
      - name: Offline tests including real helper lifecycle
        run: python -m unittest discover -s tests -v
